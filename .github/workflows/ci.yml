name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Validate relay scripts
        run: |
          perl -c Vendor/agent-relay/mnotch-relay.pl
          perl -c Vendor/agent-relay/mnotch-notify.pl
      - name: Build debug
        run: swift build
      - name: Run tests
        run: swift test
      - name: Assemble and verify release app
        env:
          CONFIG: release
          SIGN_ID: "-"
        run: |
          Scripts/build.sh
          plutil -lint build/MNotch.app/Contents/Info.plist
          codesign --verify --strict build/MNotch.app/Contents/Frameworks/MediaRemoteAdapter.framework
          codesign --verify --deep --strict build/MNotch.app/Contents/Frameworks/Sparkle.framework
          codesign --verify --strict build/MNotch.app
          test -f build/MNotch.app/Contents/Resources/Sparkle-LICENSE.txt
          test ! -e build/MNotch.app/Contents/Resources/MediaRemoteAdapterTestClient
